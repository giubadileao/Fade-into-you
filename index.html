<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Thoughts Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="biblioteca" aria-label="Biblioteca Noturna">
    <div class="lua" aria-hidden="true"></div>

    <section class="introducao" id="introducao">
      <p class="pequeno">Get ready to enter my thoughts...</p>
      <h1>some stories are meant to be felt.</h1>
      <button id="entrar" class="pequeno" type="button">⏾ entrar</button>
    </section>

    <section id="estante" class="estante" aria-hidden="true">
      <ul>
        <li>
          <button class="livro" type="button" data-livro="FourthWing"
            data-titulo="Fouth Wing"
            data-frase="There is nowhere in the world you can go where I won't find you, Violence."
            data-musica="Make you mine"
            data-artista="Madison Beer"
            data-capitulo="1"
            data-audio="https://cdn.jsdelivr.net/gh/giubadileao/My-thoughts-library@main/media/make-you-mine.mp3">Fouth Wing</button>
        </li>
        <li>
          <button class="livro" type="button" data-livro="TheCruelPrince"
            data-titulo="The Cruel Prince"
            data-frase="My sweet nemesis, kiss me until I grow tired of your kiss."
            data-musica="Lilith"
            data-artista="Saint Avangeline"
            data-capitulo="2"
            data-audio="https://cdn.jsdelivr.net/gh/giubadileao/My-thoughts-library@main/media/lilith.mp3">The Cruel Prince</button>
        </li>
        <li>
          <button class="livro" type="button" data-livro="Hideaway"
            data-titulo="Hideaway"
            data-frase="The weak are the meat that the strong eat."
            data-musica="Church"
            data-artista="Chase Atlantic"
            data-capitulo="3"
            data-audio="https://cdn.jsdelivr.net/gh/giubadileao/My-thoughts-library@main/media/church.mp3">Hideaway</button>
        </li>
        <li>
          <button class="livro" type="button" data-livro="DevoçãoSangria"
            data-titulo="Devoção Sangria"
            data-frase="moya ved'ma"
            data-musica="Haunted"
            data-artista="Beyonce"
            data-capitulo="4"
            data-audio="https://cdn.jsdelivr.net/gh/giubadileao/My-thoughts-library@main/media/haunted.mp3">Devoção Sangria</button>
        </li>
      </ul>
    </section>

    <aside id="paginaLivro" class="pagina-livro" aria-hidden="true" role="dialog" aria-modal="true">
      <button id="fechar" class="fechar" type="button" aria-label="Fechar">×</button>

      <div class="conteudo-livro">
        <div class="numero">Capítulo 1</div>
        <h2 id="tituloLivro">Título do Livro</h2>
        <p id="fraseLivro" class="frase">Uma frase que pertence ao livro selecionado.</p>

        <div class="musica" aria-label="Área de música">
          <button id="play" class="pequeno" type="button" aria-pressed="false">▶︎</button>
          <div class="info">
            <span id="nomeMusica">Nome da música</span>
            <span class="pequeno artista" id="artistaMusica">Artista</span>
          </div>

          <div id="luaMusica" class="lua-musica" aria-hidden="true"></div>
        </div>

      </div>
    </aside>

  </main>

  <script src="script.js"></script>
</body>
</html>
